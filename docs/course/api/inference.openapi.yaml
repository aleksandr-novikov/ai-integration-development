openapi: 3.1.0
info:
  title: DB Monitoring — контракт внутреннего инференса
  version: 1.1.0
  description: |
    Контракт #4 по ADR-001; реализация — inference.service (#12).
    Публикация артефакта — #5. Режим demo не означает допуска качества.
    Сервис принимает готовые немасштабированные признаки от доверенного
    Flask-адаптера; не читает историю, не вычисляет дельты и не вызывает fit.
servers:
  - url: http://localhost:8000
    description: Локальный учебный стенд
security:
  - AdapterBearer: []
paths:
  /healthz:
    get:
      operationId: health
      summary: Проверить работу процесса (не готовность модели)
      security: []
      responses:
        '200':
          description: Процесс работает; demo явно обозначен
          content:
            application/json:
              schema:
                type: object
                required: [status, demo]
                properties:
                  status: {const: ok}
                  demo: {type: boolean}
  /v1/model:
    post:
      operationId: inspectModel
      summary: Проверить доступность выбранной модели для разрешённого источника
      description: Те же авторизация, строгий JSON, 409/503 и привязка source, что у predict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRequest'
      responses:
        '200':
          description: Версии и режим проверенного артефакта без обучения
          content:
            application/json:
              schema:
                type: object
                required: [source, model_version, feature_schema_version, demo, quality_admitted]
                properties:
                  source: {$ref: '#/components/schemas/Source'}
                  model_version: {$ref: '#/components/schemas/ModelVersion'}
                  feature_schema_version: {$ref: '#/components/schemas/FeatureSchemaVersion'}
                  demo: {type: boolean}
                  quality_admitted: {type: boolean}
        '413':
          description: JSON body exceeds 64 KiB (maximum nesting depth is 32)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400': {description: invalid_json}
        '401': {description: authentication_required}
        '403': {description: source_forbidden}
        '409': {description: feature_schema_mismatch}
        '415': {description: unsupported_media_type}
        '422': {description: invalid_input}
        '503': {description: model_unavailable}
        '500': {description: internal_error}
  /v1/predict:
    post:
      operationId: predictAnomaly
      summary: Оценить одну точку выбранной опубликованной моделью
      description: |
        Внутренний endpoint. Только application/json с конечными
        JSON-числами binary64; NaN/Infinity/-Infinity и переполнение при
        декодировании (например, 1e400) дают 400. Строки и boolean не приводятся
        к числам, а дают 422. До доступа к модели проверить
        principal токена и разрешённый source. Поля project_id/connection_id
        сами по себе прав не предоставляют. Модель и scaler фиксируются
        вместе на весь запрос; при отсутствии модели нет скрытого обучения.
        Предыдущую согласованную точку выбирает адаптер. Без неё он не
        вызывает этот endpoint и сообщает insufficient_history своему клиенту.
        model_version ищется только в области разрешённого полного source.
        Отсутствующая версия и версия другого источника одинаково дают 503.
      x-json-policy:
        strict-decoding: true
        finite-binary64: true
        coerce-numeric-strings: false
        coerce-booleans: false
      x-validation-order:
        - '401: проверить сервисный токен'
        - '415/413/400: проверить Content-Type, размер/глубину тела и строго декодировать JSON'
        - '422: проверить структуру, типы и ограничения полей'
        - '403: проверить доступ к полному source'
        - '409: проверить поддержку feature_schema_version сервисом'
        - '422: проверить порядок времени и согласованность признаков'
        - '503: найти model_version только для разрешённого source; проверить манифест'
        - '409: сверить схему запроса с целостным манифестом до загрузки модели'
        - '503: проверить наличие, целостность и загрузку модели/scaler'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionRequest'
            example:
              source: {project_id: project-a, connection_id: connection-a, schema_name: public, table_name: orders}
              observed_at: '2026-10-25T12:00:00+00:00'
              previous_observed_at: '2026-10-25T11:45:00+00:00'
              model_version: demo-if-2026-09-26
              feature_schema_version: 1.0.0
              features: {row_count: 110.0, null_rate: 0.03, d_row_count: 10.0, d_null_rate: 0.01}
      responses:
        '200':
          description: |
            source и observed_at соответствуют запросу; возвращены фактически
            использованные версии. is_anomaly = (score < 0), threshold = 0.
            Обновление/откат активной модели не меняет уже сохранённый ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
              example:
                source: {project_id: project-a, connection_id: connection-a, schema_name: public, table_name: orders}
                observed_at: '2026-10-25T12:00:00+00:00'
                model_version: demo-if-2026-09-26
                feature_schema_version: 1.0.0
                score: -0.12
                threshold: 0
                is_anomaly: true
        '413':
          description: JSON body exceeds 64 KiB (maximum nesting depth is 32)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Неразбираемый JSON, NaN/Infinity/-Infinity или переполнение binary64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                properties:
                  error:
                    properties:
                      code: {const: invalid_json}
              example: {error: {code: invalid_json, message: Требуется корректный JSON}}
        '401':
          description: Токен отсутствует или недействителен; никаких чтений модели
          headers:
            WWW-Authenticate:
              schema: {type: string}
              example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                properties:
                  error:
                    properties:
                      code: {const: authentication_required}
              example: {error: {code: authentication_required, message: Требуется сервисный токен}}
        '403':
          description: Principal токена не имеет доступа к указанному source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                properties:
                  error:
                    properties:
                      code: {const: source_forbidden}
              example: {error: {code: source_forbidden, message: Источник недоступен}}
        '409':
          description: |
            Синтаксически корректная версия схемы не поддерживается
            (в v1 поддерживается 1.0.0) или несовместима с выбранным артефактом.
            Совместимость проверяется по целостному манифесту разрешённого
            источника до десериализации модели; порядок — x-validation-order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                properties:
                  error:
                    properties:
                      code: {const: feature_schema_mismatch}
              example: {error: {code: feature_schema_mismatch, message: Несовместимая схема признаков}}
        '415':
          description: Content-Type отличается от application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                properties:
                  error:
                    properties:
                      code: {const: unsupported_media_type}
              example: {error: {code: unsupported_media_type, message: Требуется application/json}}
        '422':
          description: |
            Неверные типы/границы/поля, время без часового пояса,
            previous_observed_at >= observed_at или противоречивые признаки.
            row_count - d_row_count >= 0; null_rate - d_null_rate в [0, 1].
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                properties:
                  error:
                    properties:
                      code: {const: invalid_input}
              example: {error: {code: invalid_input, message: Неверные входные признаки}}
        '503':
          description: |
            Для разрешённого источника указанная опубликованная модель/scaler
            отсутствует, не загружается или не прошла проверку целостности.
            Версия другого источника считается отсутствующей; её существование
            не раскрывается. Повреждённый манифест также даёт 503, не 409.
            Артефакт не заменяется моделью другого источника или последним joblib.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                properties:
                  error:
                    properties:
                      code: {const: model_unavailable}
              example: {error: {code: model_unavailable, message: Опубликованная модель недоступна}}
        '500':
          description: Техническая ошибка без traceback, путей и секретов в ответе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                properties:
                  error:
                    properties:
                      code: {const: internal_error}
              example: {error: {code: internal_error, message: Ошибка инференса}}
components:
  securitySchemes:
    AdapterBearer:
      type: http
      scheme: bearer
      description: |
        Оpaque сервисный токен авторизованного Flask-адаптера, не cookie
        браузера и не project_id. Секрет вне репозитория; principal связан
        с allowlist полного source. За пределами изолированного локального
        стенда — TLS. Проверка пользователя/членства остаётся во Flask.
  schemas:
    Source:
      type: object
      required: [project_id, connection_id, schema_name, table_name]
      additionalProperties: false
      description: |
        Идентичность данных: проект + подключение + схема/namespace + таблица.
        Для Iceberg schema_name — полный effective namespace.
        Все четыре поля сравниваются точно, без приведения регистра.
      properties:
        project_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        connection_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        schema_name: {type: string, minLength: 1, maxLength: 255}
        table_name: {type: string, minLength: 1, maxLength: 255}
    ModelVersion:
      type: string
      pattern: '^(?!legacy-unknown$)[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      description: Неизменяемый ID опубликованного манифеста #5, не путь к файлу
    FeatureSchemaVersion:
      type: string
      maxLength: 32
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      description: Версия построения признаков; поддерживается 1.0.0, другие дают 409
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 с обязательным часовым поясом; сравнение по времени UTC
    Features:
      type: object
      required: [row_count, null_rate, d_row_count, d_null_rate]
      additionalProperties: false
      description: |
        Четыре конечных числа до scaler. Вектор строится в порядке
        row_count, null_rate, d_row_count, d_null_rate. Дельты — разности
        с предыдущим доступным согласованным наблюдением, без деления на время.
      properties:
        row_count: {type: number, format: double, minimum: 0}
        null_rate: {type: number, format: double, minimum: 0, maximum: 1}
        d_row_count: {type: number, format: double}
        d_null_rate: {type: number, format: double, minimum: -1, maximum: 1}
    PredictionRequest:
      type: object
      required: [source, observed_at, previous_observed_at, model_version, feature_schema_version, features]
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/Source'
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        previous_observed_at:
          $ref: '#/components/schemas/Timestamp'
        model_version:
          $ref: '#/components/schemas/ModelVersion'
        feature_schema_version:
          $ref: '#/components/schemas/FeatureSchemaVersion'
        features:
          $ref: '#/components/schemas/Features'
    ModelRequest:
      type: object
      required: [source, model_version, feature_schema_version]
      additionalProperties: false
      properties:
        source: {$ref: '#/components/schemas/Source'}
        model_version: {$ref: '#/components/schemas/ModelVersion'}
        feature_schema_version: {$ref: '#/components/schemas/FeatureSchemaVersion'}
    PredictionResponse:
      type: object
      required: [source, observed_at, model_version, feature_schema_version, score, threshold, is_anomaly]
      additionalProperties: true
      allOf:
        - if:
            required: [score]
            properties:
              score: {exclusiveMaximum: 0}
          then:
            properties:
              is_anomaly: {const: true}
          else:
            properties:
              is_anomaly: {const: false}
      properties:
        source:
          $ref: '#/components/schemas/Source'
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        model_version:
          $ref: '#/components/schemas/ModelVersion'
        feature_schema_version:
          $ref: '#/components/schemas/FeatureSchemaVersion'
        score:
          type: number
          format: double
          description: Сырой decision_function, без min-max нормализации
        threshold: {type: number, format: double, const: 0}
        is_anomaly: {type: boolean}
        demo: {type: boolean, description: Учебный режим сохраняется вместе с результатом}
        quality_admitted: {type: boolean, description: Положительный допуск проверяется только в обычном режиме}
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [invalid_json, authentication_required, source_forbidden, feature_schema_mismatch, unsupported_media_type, invalid_input, model_unavailable, internal_error]
            message: {type: string, minLength: 1}
