name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret
          DATABASE_URL: postgresql://test:test@localhost/test
        run: |
          coverage run -m pytest -v
          coverage report -m
          coverage xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # Integration tests (#44) — real databases and Iceberg/MinIO via
  # testcontainers. Run before merge too, so broken images are caught in PRs.
  integration:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_SMOKE_IMAGE: course13-ci:${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_SMOKE_SHA: ${{ github.sha }}
      COMPOSE_SMOKE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        env:
          SECRET_KEY: test-secret
          DATABASE_URL: postgresql://test:test@localhost/test
        run: pytest -m integration -v --tb=short

      # Reuse the no-cache image built by test_inference_image; no second build.
      - name: Verify isolated Compose infrastructure and record model observations
        run: python -m scripts.verify_compose_demo run

      - name: Check actual normal and incident model results
        run: python -m scripts.verify_compose_demo check-outcome

      - name: Clean up only this runner's isolated Compose project
        if: always()
        run: python -m scripts.verify_compose_demo cleanup

      - name: Upload sanitized Compose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-evidence-${{ github.sha }}
          path: artifacts/compose-demo/ci-report.json
          if-no-files-found: warn
          retention-days: 14

  # E2E dashboard tests (#45) — Playwright + headless Chromium drives the
  # live Flask app. Master-only: download + browser-driven flow is slow
  # on every PR.
  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          SECRET_KEY: test-secret
          DATABASE_URL: postgresql://test:test@localhost/test
        run: pytest -m e2e -v --tb=short

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/_artifacts/
          if-no-files-found: ignore
          retention-days: 14
